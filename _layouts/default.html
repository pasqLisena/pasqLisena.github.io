<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <meta name="author" content="Pasquale Lisena">
  <meta name="description" content="{{ page.description }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="3k-A4xWf0y4Aqrq9-AOD89DWNM0jLBQdeMYODzbnr7E" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css?family=Exo:200,400,600|Roboto:300,400,500&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css?family=Exo:200,400,600|Roboto:300,400,500&display=swap" rel="stylesheet"></noscript>
  <link rel="preload" href="https://cdn.materialdesignicons.com/1.9.32/css/materialdesignicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://cdn.materialdesignicons.com/1.9.32/css/materialdesignicons.min.css" rel="stylesheet"></noscript>
  <link rel="preload" as="image" href="/images/pasquale_lisena.jpg">
  <link href="css/style.css" rel="stylesheet">

  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DPE3VSGHE6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-DPE3VSGHE6');
  </script>

</head>

<body>
  {% include header.big.html %}

  <main class="page">
    {% if page.news %}
    <div class="news">
      <ul data-children="{{page.news | size}}">
        {% for item in page.news %}
        <li>{{item | markdownify}}</li>
        {% endfor %}
      </ul>
    </div>
    {% endif %}


    <div class="inner layout-flex">
      <div>
        {{ content }}
      </div>
      <div>
        <div class="box twitter" id="twitter">
          <iframe src="https://www.linkedin.com/embed/feed/update/urn:li:share:7447216626896244736?collapsed=1" height="410" width="350" frameborder="0" allowfullscreen="" title="Embedded post"></iframe>
        </div>
        <div class="box">
          <h2>My Current Projects.</h2>
          <div>
            {% for item in page.current_proj %}
            <a href="{{item.uri}}"><img class="proj_img" alt="{{item.name}}" src="{{item.img}}" /></a>
            {% endfor %}
          </div>
        </div>

        <div class="box">
          <h2>My Talk at RecSys 2025.</h2>

          <div id="presentation-embed-39045764"></div>
            <script src="https://slideslive.com/embed_presentation.js"></script>
            <script>
              embed = new SlidesLiveEmbed("presentation-embed-39045764", {
                presentationId: "39045764",
                autoPlay: false,
                verticalEnabled: true,
              });
            </script>
        </div>
      </div>
    </div>
  </main>

  {% include footer.html %}

  <script type="application/ld+json">
    {{site.data.pasquale | jsonify}}
  </script>
</body>

</html>
